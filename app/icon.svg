<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#262626" stroke-width="1.5" />
  
  <!-- RW Monogram in vibrant #C3E41D -->
  <g fill="#C3E41D">
    <text x="32" y="42" font-family="'Fira Code', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="-1" text-anchor="middle">RW</text>
  </g>
  <!-- Tiny subtle neon accent dot -->
  <circle cx="49" cy="23" r="3.5" fill="#C3E41D" />
</svg>
