name: Instagram Sync (agent Content)

# Detecte les nouvelles publications de @robinwattier et les integre a la section "Content".
# Reel seul -> carte video ; Carrousel (meme avec une video) -> carte carrousel.
# Rien n'est reimporte : les posts deja presents / anterieurs a la baseline sont ignores.
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (decale de la minute 0 pour eviter les pics GitHub)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : detecte et classe sans rien publier"
        type: boolean
        default: false
      fail_on_block:
        description: "Echouer le workflow si Instagram bloque l'IP GitHub Actions"
        type: boolean
        default: false

permissions:
  contents: write   # commit des nouveaux contenus
  actions: write    # declenche le deploiement (un push via GITHUB_TOKEN ne le declenche pas seul)

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (sharp + ffmpeg-static)
        run: |
          npm ci --no-audit --no-fund || echo "Installation partielle (posters JPG uniquement)"

      - name: Detect & integrate new Instagram posts
        id: sync
        continue-on-error: true
        env:
          IG_COOKIE: ${{ secrets.IG_COOKIE }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ "${{ inputs.fail_on_block }}" != "true" ]; then
            ARGS+=("--soft-on-block")
          fi
          node sync-instagram.js "${ARGS[@]}"

      - name: Commit & push new content
        id: commit
        if: ${{ inputs.dry_run != true && (steps.sync.outputs.sync_status == 'ok' || steps.sync.outputs.sync_status == 'partial') }}
        run: |
          git config user.name "instagram-agent[bot]"
          git config user.email "instagram-agent@users.noreply.github.com"
          git add data.json projects-data.js index.html instagram-config.json assets/projets/instagram
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun nouveau contenu."
          else
            git commit -m "feat(content): ajout automatique de publications Instagram"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deployment
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Job summary & observability
        if: ${{ always() }}
        env:
          SYNC_STATUS: ${{ steps.sync.outputs.sync_status || 'unknown' }}
          BLOCK_CODE: ${{ steps.sync.outputs.block_code }}
          ADDED_COUNT: ${{ steps.sync.outputs.added_count || '0' }}
          TOTAL_COUNT: ${{ steps.sync.outputs.total_count }}
        run: |
          {
            echo "## Instagram Sync (agent Content)"
            echo "- **Statut** : \`$SYNC_STATUS\`"
            [ -n "$BLOCK_CODE" ] && echo "- **Code diagnostic** : \`$BLOCK_CODE\`"
            [ -n "$TOTAL_COUNT" ] && echo "- **Ajouts / Total galerie** : $ADDED_COUNT / $TOTAL_COUNT"
            if [ "$SYNC_STATUS" = "blocked" ]; then
              echo ""
              echo "> Instagram bloque l'acces anonyme depuis l'IP cloud GitHub Actions (\`$BLOCK_CODE\`). Pour une synchro 100% cloud, ajoutez le secret \`IG_COOKIE\`, ou laissez l'agent local \`npm run sync\` tourner sur votre poste."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SYNC_STATUS" = "blocked" ]; then
            echo "::warning::Instagram bloque l'acces anonyme depuis l'IP GitHub Actions ($BLOCK_CODE). Ajoutez le secret IG_COOKIE ou synchronisez localement (npm run sync)."
          fi

      - name: Fail the run if the sync reported an error
        if: ${{ steps.sync.outcome == 'failure' }}
        env:
          BLOCK_CODE: ${{ steps.sync.outputs.block_code || 'ERROR' }}
          BLOCK_MESSAGE: ${{ steps.sync.outputs.block_message || 'voir les logs de l etape sync' }}
        run: |
          echo "::error::La synchronisation Instagram a echoue [$BLOCK_CODE] : $BLOCK_MESSAGE"
          exit 1
